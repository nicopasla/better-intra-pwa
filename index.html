<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Better Intra</title>
    <meta
      name="description"
      content="Better Intra — mobile dashboard for 42 Intra."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Better Intra" />
  </head>
  <body>
    <!-- iOS standalone: see .pwa-status-bar-surface in style.css. -->
    <div class="pwa-status-bar-surface" aria-hidden="true"></div>
    <div id="app"></div>
    <!-- Applies the last resolved theme before first paint (theme.ts keeps it
         up to date). Without this the app flashes the default light/dark theme. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("ft_theme") || "system";
          var look = null;
          var raw = localStorage.getItem("ft_theme_resolved");
          if (raw) look = JSON.parse(raw);
          if (!look || !look.preset || !look.mode) look = null;
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (pref === "dark" || pref === "light") {
            look = { preset: pref, mode: pref };
          } else if (pref !== "extension" || !look) {
            look = { preset: dark ? "dark" : "light", mode: dark ? "dark" : "light" };
          }
          document.documentElement.dataset.theme = look.preset;
          document.documentElement.dataset.mode = look.mode;
        } catch (e) {
          /* first visit, storage disabled, or corrupt cache */
        }
      })();
    </script>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
